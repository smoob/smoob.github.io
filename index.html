<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Power Plant Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script>
/* Set the theme before first paint to avoid a flash of the wrong palette. */
(function(){
  try{
    var t = localStorage.getItem('ppr-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ============================ theme tokens ============================ */
:root{
  --side:372px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --r:10px; --r-sm:7px; --r-xs:5px;

  /* ---- light palette (default) ---- */
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f3f5f9; --surface-3:#e9edf3;
  --border:#dce1e9; --border-soft:#e9edf2;
  --text:#151922; --text-2:#525a67; --text-3:#8b93a1;
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-weak:rgba(37,99,235,.10);
  --accent-contrast:#ffffff;
  --shadow-sm:0 1px 2px rgba(18,24,38,.06),0 1px 3px rgba(18,24,38,.08);
  --shadow-md:0 4px 14px rgba(18,24,38,.10),0 2px 6px rgba(18,24,38,.07);
  --shadow-lg:0 18px 50px rgba(15,20,32,.22);

  /* Status */
--run: #22c55e;        /* vivid green — running */
--hold: #f59e0b;       /* amber — holding */
--trip: #ef4444;       /* red — tripped */
--idle: #7dd3fc;       /* light sky blue — idle, calm but clearly visible */

/* Energy sources */
--coal: #7c2d12;       /* deep terracotta/rust — visible, reads as "coal ember" not just black */
--gas: #38bdf8;        /* sky blue — natural gas flame */
--oil: #ea580c;        /* deep orange — combustion */
--nuclear: #14b8a6;    /* teal — distinct, high-tech */
--hydro: #2563eb;      /* royal blue — water */
--wind: #4ade80;       /* bright green — clean air */
--solar: #facc15;      /* golden yellow — sun */
--geothermal: #f43f5e; /* rose red — heat from earth */
--biomass: #a3e635;    /* lime — organic matter */
--storage: #8b5cf6;    /* violet — tech/battery */
--other: #db2777;      /* magenta/pink — catch-all, now actually stands out */

  --map-ground:#dfe4ea;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08090c; --surface:#101216; --surface-2:#171a20; --surface-3:#20242b;
    --border:#282c34; --border-soft:#1c1f25;
    --text:#f0f1f4; --text-2:#9ba1ad; --text-3:#666b76;
    --accent:#5e9bff; --accent-2:#7db0ff; --accent-weak:rgba(94,155,255,.14);
    --accent-contrast:#05070b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow-md:0 8px 24px rgba(0,0,0,.55);
    --shadow-lg:0 24px 64px rgba(0,0,0,.68);
    
/* Status */
--run: #22c55e;        /* vivid green — running */
--hold: #f59e0b;       /* amber — holding */
--trip: #ef4444;       /* red — tripped */
--idle: #7dd3fc;       /* light sky blue — idle, calm but clearly visible */

/* Energy sources */
--coal: #7c2d12;       /* deep terracotta/rust — visible, reads as "coal ember" not just black */
--gas: #38bdf8;        /* sky blue — natural gas flame */
--oil: #ea580c;        /* deep orange — combustion */
--nuclear: #14b8a6;    /* teal — distinct, high-tech */
--hydro: #2563eb;      /* royal blue — water */
--wind: #4ade80;       /* bright green — clean air */
--solar: #facc15;      /* golden yellow — sun */
--geothermal: #f43f5e; /* rose red — heat from earth */
--biomass: #a3e635;    /* lime — organic matter */
--storage: #8b5cf6;    /* violet — tech/battery */
--other: #db2777;      /* magenta/pink — catch-all, now actually stands out */

    --map-ground:#07110f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08090c; --surface:#101216; --surface-2:#171a20; --surface-3:#20242b;
  --border:#282c34; --border-soft:#1c1f25;
  --text:#f0f1f4; --text-2:#9ba1ad; --text-3:#666b76;
  --accent:#5e9bff; --accent-2:#7db0ff; --accent-weak:rgba(94,155,255,.14);
  --accent-contrast:#05070b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.55);
  --shadow-lg:0 24px 64px rgba(0,0,0,.68);
  
/* Status */
--run: #22c55e;        /* vivid green — running */
--hold: #f59e0b;       /* amber — holding */
--trip: #ef4444;       /* red — tripped */
--idle: #7dd3fc;       /* light sky blue — idle, calm but clearly visible */

/* Energy sources */
--coal: #7c2d12;       /* deep terracotta/rust — visible, reads as "coal ember" not just black */
--gas: #38bdf8;        /* sky blue — natural gas flame */
--oil: #ea580c;        /* deep orange — combustion */
--nuclear: #14b8a6;    /* teal — distinct, high-tech */
--hydro: #2563eb;      /* royal blue — water */
--wind: #4ade80;       /* bright green — clean air */
--solar: #facc15;      /* golden yellow — sun */
--geothermal: #f43f5e; /* rose red — heat from earth */
--biomass: #a3e635;    /* lime — organic matter */
--storage: #8b5cf6;    /* violet — tech/battery */
--other: #db2777;      /* magenta/pink — catch-all, now actually stands out */

  --map-ground:#07110f;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .2s ease,color .2s ease;overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-weak)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px;border:3px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ============================ masthead ============================ */
.masthead{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:11px 18px;border-bottom:1px solid var(--border);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px;height:20px;display:block}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1;white-space:nowrap}
.brand .scope-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--text-3);display:block;margin-top:1px}

.counters{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.counter{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:4px 10px;line-height:1.15}
.counter b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.01em}
.counter span{display:block;font-size:9px;letter-spacing:.09em;color:var(--text-3);text-transform:uppercase;margin-top:1px}

.icon-btn{
  width:36px;height:36px;flex:0 0 36px;border-radius:var(--r-sm);cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
  display:grid;place-items:center;transition:.14s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--text);background:var(--surface-3)}
.icon-btn svg{width:18px;height:18px;display:block}

/* ============================ frame ============================ */
.frame{display:flex;height:calc(100vh - 61px);min-height:400px}
.sidebar{
  width:var(--side);flex:0 0 var(--side);display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--border);background:var(--surface);
  transition:margin-left .24s cubic-bezier(.3,.8,.3,1);
}
.frame.no-side .sidebar{margin-left:calc(-1 * var(--side));}
.mapcol{flex:1 1 auto;position:relative;background:var(--surface-2);min-width:0}
#map{position:absolute;inset:0}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}

/* ---------- sidebar head ---------- */
.side-head{padding:12px 13px 11px;border-bottom:1px solid var(--border);flex:0 0 auto}
.search-wrap{position:relative;margin-bottom:9px}
.search-wrap input{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 34px 10px 34px;font-size:13px;transition:.14s;
}
.search-wrap input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-weak)}
.search-wrap .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3);pointer-events:none}
.search-wrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;pointer-events:none}
.search-wrap input:not(:placeholder-shown) + .mag + kbd{display:none}

.ctl-row{display:flex;align-items:center;gap:7px}
.ctl-btn{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2);
  padding:8px 11px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.13s;white-space:nowrap;
}
.ctl-btn:hover{border-color:var(--accent);color:var(--text)}
.ctl-btn[aria-expanded="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--text)}
.ctl-btn svg{width:14px;height:14px}
.ctl-btn .fbadge{font-family:var(--mono);font-size:10px;background:var(--accent);color:var(--accent-contrast);border-radius:9px;padding:0 6px;line-height:16px;min-width:16px;text-align:center}
.sort-sel{
  flex:1 1 auto;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:8px 9px;font-size:12px;color:var(--text);cursor:pointer;
}
.sort-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.tally{margin-top:9px;font-size:11.5px;color:var(--text-2)}
.tally b{color:var(--text);font-weight:600;font-family:var(--mono)}
.tally .dot{color:var(--border);margin:0 6px}

/* ---------- filters (collapsible block) ---------- */
.filters{flex:0 0 auto;max-height:46vh;overflow-y:auto;border-bottom:1px solid var(--border);padding:12px 13px 4px;background:var(--surface-2)}
.filters.collapsed{display:none}
.filters-tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.mini-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text-2);padding:6px 10px;font-size:11px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.13s}
.mini-btn:hover{border-color:var(--accent);color:var(--text)}
.mini-btn svg{width:13px;height:13px}
.fgroup{margin-bottom:14px}
.fgroup > h2{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11.5px;color:var(--text-2);transition:.13s}
.chip:hover{border-color:var(--text-3);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--text)}
.chip .swatch{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.chip .n{color:var(--text-3);font-family:var(--mono);font-size:10px}
.chip[aria-pressed="true"] .n{color:var(--text-2)}
.lamp{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.lamp.operating{background:var(--run);box-shadow:0 0 0 3px color-mix(in srgb,var(--run) 22%,transparent)}
.lamp.retired{background:var(--trip)}
.lamp.standby,.lamp.planned{background:var(--hold);box-shadow:0 0 0 3px color-mix(in srgb,var(--hold) 22%,transparent)}
.lamp.cancelled,.lamp.unknown{background:var(--idle)}
.filters select,.filters .num{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 9px;font-size:12.5px;transition:.14s}
.filters select:focus,.filters .num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.range{display:flex;align-items:center;gap:8px}
.range .num{width:100%}
.range .dash{color:var(--text-3)}
.hint{font-size:10.5px;color:var(--text-3);margin:7px 0 0}
.toggle-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--text-2);cursor:pointer;padding:4px 0}
.toggle-row input{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}

/* ---------- ruler + list ---------- */
.ruler{position:relative;height:19px;flex:0 0 19px;background:var(--surface);border-bottom:1px solid var(--border)}
.ruler .rin{position:relative;height:100%;margin:0 14px}
.ruler .lab{position:absolute;top:5px;font-family:var(--mono);font-size:9px;color:var(--text-3);transform:translateX(-50%)}
.ruler .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--border-soft)}
.list{flex:1 1 auto;overflow-y:auto;background:var(--bg);min-height:0}

.card{
  display:block;width:100%;text-align:left;background:var(--surface);border:0;
  border-bottom:1px solid var(--border-soft);cursor:pointer;padding:11px 14px;position:relative;transition:background .12s;
}
.card:hover{background:var(--surface-2)}
.card[aria-current="true"]{background:var(--accent-weak)}
.card[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.c-top{display:flex;align-items:center;gap:7px;min-width:0}
.c-top strong{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.c-cap{font-family:var(--mono);font-size:12.5px;color:var(--text);flex:0 0 auto;white-space:nowrap}
.c-cap small{color:var(--text-3);font-size:9px;letter-spacing:.05em}
.c-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-span{margin-top:7px}
.badge{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:.06em;border-radius:3px;padding:1px 4px;flex:0 0 auto}
.badge-photo{color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-weak)}
.badge-site{color:var(--text-3);border:1px solid var(--border)}

.span{display:block;position:relative;width:100%}
.span .grid{position:absolute;top:0;bottom:0;width:1px;background:var(--border-soft)}
.span .bar{position:absolute;height:6px;border-radius:2px;animation:grow .34s cubic-bezier(.2,.8,.3,1) both}
.span .bar.undated{background:none;border:1px dashed var(--border)}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.span .bar{animation:none}}
.span .more{position:absolute;left:0;font-family:var(--mono);font-size:9px;color:var(--text-3)}

/* ============================ map furniture ============================ */
.map-fab{
  position:absolute;left:12px;top:12px;z-index:600;
  width:38px;height:38px;border-radius:var(--r-sm);cursor:pointer;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  display:grid;place-items:center;box-shadow:var(--shadow-md);transition:.14s;
}
.map-fab:hover{border-color:var(--accent);color:var(--text)}
.map-fab svg{width:19px;height:19px}
.leaflet-container{background:var(--map-ground);font-family:var(--sans)}
.leaflet-top.leaflet-left{margin-top:56px} /* clear the FAB */
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 88%,transparent)!important;color:var(--text-3)!important;font-family:var(--mono)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--text-2)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
.leaflet-bar a:hover{background:var(--surface-2)!important}
.leaflet-control-layers{background:var(--surface)!important;border:1px solid var(--border)!important;border-radius:var(--r-sm)!important;color:var(--text-2)!important;box-shadow:var(--shadow-md)!important}
.leaflet-control-layers-toggle{background-color:var(--surface)!important;border:1px solid var(--border)!important;border-radius:var(--r-sm)!important}
.leaflet-control-layers-expanded{padding:9px 11px!important;font-size:12px!important;color:var(--text)!important}
.leaflet-control-layers label{margin:3px 0!important;cursor:pointer}
.leaflet-control-layers-separator{border-top:1px solid var(--border-soft)!important}
.leaflet-tooltip{background:var(--surface)!important;border:1px solid var(--border)!important;color:var(--text)!important;box-shadow:var(--shadow-sm)!important;font-family:var(--mono)!important;font-size:11px!important;border-radius:5px!important}
.leaflet-tooltip-top:before{border-top-color:var(--border)!important}
.map-note{
  position:absolute;left:12px;bottom:12px;z-index:500;pointer-events:none;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--text-2);
  background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:4px 8px;box-shadow:var(--shadow-sm);
}

/* ============================ detail drawer ============================ */
.scrim{position:fixed;inset:0;background:rgba(8,11,16,.4);backdrop-filter:blur(1px);z-index:900;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(660px,94vw);z-index:901;
  background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);
  transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.85,.3,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{padding:16px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);position:relative}
.dhead .tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:34px}
.dhead h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.1}
.assettag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);background:var(--accent-weak);border-radius:5px;padding:2px 7px;white-space:nowrap}
.dhead .where{font-family:var(--mono);font-size:11.5px;color:var(--text-2);margin-top:6px}
.dclose{position:absolute;right:13px;top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);width:30px;height:30px;cursor:pointer;color:var(--text-2);display:grid;place-items:center;transition:.13s}
.dclose:hover{border-color:var(--accent);color:var(--text)}
.dclose svg{width:16px;height:16px}
.dbody{overflow-y:auto;padding:18px;flex:1 1 auto}
.dsec{margin-bottom:26px}
.dsec > h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 11px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.fact{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--r-sm);padding:9px 11px}
.fact span{display:block;font-size:9px;letter-spacing:.09em;color:var(--text-3);text-transform:uppercase}
.fact b{display:block;font-family:var(--mono);font-size:14px;font-weight:500;margin-top:3px}
.fact b.dim,.dim{color:var(--text-3);font-weight:400}
table.units{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
table.units th{text-align:left;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid var(--border)}
table.units td{padding:7px 8px 7px 0;border-bottom:1px solid var(--border-soft);vertical-align:top}
table.units td.n{text-align:right}
table.units tr:last-child td{border-bottom:0}
.fuel-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.dspan{position:relative;margin-top:4px}
.dspan .lane{position:relative;height:24px;border-bottom:1px solid var(--border-soft)}
.dspan .lane:last-child{border-bottom:0}
.dspan .lane .lbl{position:absolute;left:0;top:6px;font-family:var(--mono);font-size:10px;color:var(--text-2);width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dspan .track{position:absolute;left:56px;right:0;top:0;bottom:0}
.dspan .bar{position:absolute;top:8px;height:8px;border-radius:2px}
.dspan .yr{position:absolute;top:6px;font-family:var(--mono);font-size:9px;color:var(--text-3);white-space:nowrap}
.dspan .axis{position:relative;height:16px;margin-left:56px;margin-top:2px}
.dspan .axis .lab{position:absolute;font-family:var(--mono);font-size:9px;color:var(--text-3);transform:translateX(-50%)}
.dspan .grid{position:absolute;top:0;bottom:0;width:1px;background:var(--border-soft)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media-card{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:.14s}
.media-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);text-decoration:none}
.media-card .ph{aspect-ratio:4/3;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--text-3);letter-spacing:.08em}
.media-card img{width:100%;height:100%;object-fit:cover;display:block}
.media-card .mc{padding:8px 9px}
.media-card .mt{font-size:11px;line-height:1.35;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.media-card .ms{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;color:var(--text-3);text-transform:uppercase}
.pill{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-top:5px;color:var(--text-3);text-transform:uppercase}
.pill.pd{border-color:color-mix(in srgb,var(--run) 45%,transparent);color:var(--run)}
.pill.unver{border-color:color-mix(in srgb,var(--hold) 50%,transparent);color:var(--hold)}
.satview{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.satview img{width:100%;display:block;aspect-ratio:60/34;object-fit:cover;background:var(--surface-3)}
.street-links{display:flex;flex-wrap:wrap;gap:8px}
.street-link{display:inline-flex;align-items:center;font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;color:var(--text-2);transition:.13s}
.street-link:hover{border-color:var(--accent);color:var(--text);text-decoration:none}
.satcap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-family:var(--mono);font-size:9.5px;color:var(--text-3);letter-spacing:.03em;border-top:1px solid var(--border-soft)}
.satcap .link-btn{padding:4px 9px;font-size:9.5px}
.enc{display:flex;gap:15px;align-items:flex-start}
.enc-lead{flex:0 0 180px;display:block;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.enc-lead img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.enc-body{flex:1 1 auto;min-width:0}
.enc-extract{font-size:13px;color:var(--text-2);line-height:1.6;margin:0 0 8px}
.enc-links{margin-top:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em}
.enc-links a{color:var(--accent)}
.enc-links .sep{color:var(--border);margin:0 8px}
.enc-cred{margin-top:10px;font-size:10.5px}
@media(max-width:560px){.enc{flex-direction:column}.enc-lead{flex-basis:auto;width:100%}}
.link-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xs);color:var(--text-2);cursor:pointer;font-family:var(--mono);transition:.13s}
.link-btn:hover{border-color:var(--accent);color:var(--text)}
.note{font-size:12px;color:var(--text-3);line-height:1.55}
.note strong{color:var(--text-2);font-weight:600}
.note code,.state-msg code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--accent)}
.caveat{border-left:3px solid var(--hold);border-radius:0 var(--r-xs) var(--r-xs) 0;padding:10px 13px;background:var(--surface-2);font-size:12px;color:var(--text-2);line-height:1.55}
.sibling{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.13s}
.sibling:hover{border-color:var(--accent)}
.sibling strong{font-size:14px;font-weight:600}
.sibling span{font-family:var(--mono);font-size:10px;color:var(--text-3);display:block;margin-top:2px}

/* ============================ states / boot ============================ */
.state-msg{padding:40px 24px;max-width:560px;margin:0 auto;text-align:center}
.state-msg h2{font-size:18px;font-weight:700;margin:0 0 10px}
.state-msg p{color:var(--text-2);font-size:13px;line-height:1.6}
.state-msg pre{text-align:left;font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;color:var(--text-2)}
#boot{position:fixed;inset:61px 0 0 0;background:var(--bg);z-index:800;display:grid;place-items:center;align-content:center}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

/* ============================ responsive ============================ */
@media (max-width:1100px){:root{--side:330px}}
@media (max-width:820px){
  body{overflow:auto}
  .frame{flex-direction:column;height:auto}
  .sidebar{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--border)}
  .frame.no-side .sidebar{margin-left:0;display:none}
  .list{max-height:52vh}
  .mapcol{width:100%;flex:none;height:60vh;min-height:360px}
  .counters{order:3;width:100%;margin-left:0}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13.5H11l-1 8.5L19.5 10H13l0-8Z" fill="currentColor"/></svg>
    </div>
    <div>
      <h1>US Power Plant Registry</h1>
      <span class="scope-tag" id="scope-tag">loading…</span>
    </div>
  </div>
  <div class="counters" id="counters"></div>
  <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
</header>

<div class="frame" id="frame" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="search-wrap">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="q" type="search" placeholder="Name, utility, county…" autocomplete="off" aria-label="Search plants">
        <kbd>/</kbd>
      </div>
      <div class="ctl-row">
        <button class="ctl-btn" id="filters-toggle" type="button" aria-expanded="true" aria-controls="filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span>Filters</span><span class="fbadge" id="fbadge" hidden>0</span>
        </button>
        <select class="sort-sel" id="sort" aria-label="Sort order">
          <option value="cap-desc">Largest capacity</option>
          <option value="cap-asc">Smallest capacity</option>
          <option value="oldest">Oldest first</option>
          <option value="newest">Newest first</option>
          <option value="retired">Recently retired</option>
          <option value="cf-desc">Highest capacity factor</option>
          <option value="name">Name A–Z</option>
        </select>
        <button class="icon-btn" id="export" type="button" title="Export current results as CSV" aria-label="Export CSV" style="width:36px;height:36px;flex:0 0 36px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        </button>
      </div>
      <div class="tally" id="tally"></div>
    </div>

    <div class="filters" id="filters">
      <div class="filters-tools">
        <button class="mini-btn" id="reset-all" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset filters</span>
        </button>
      </div>
      <div class="fgroup"><h2>Status</h2><div class="chips" id="f-status"></div></div>
      <div class="fgroup"><h2>Fuel</h2><div class="chips" id="f-fuel"></div></div>
      <div class="fgroup"><h2>State</h2>
        <select id="f-state" aria-label="Filter by state"><option value="">All states</option></select>
      </div>
      <div class="fgroup"><h2>Minimum capacity</h2>
        <div class="range"><input class="num" id="cap-min" type="number" inputmode="numeric" placeholder="min MW" aria-label="Minimum capacity in MW"></div>
      </div>
      <div class="fgroup"><h2>Year established</h2>
        <div class="range">
          <input class="num" id="y-min" type="number" inputmode="numeric" placeholder="from" aria-label="Earliest year">
          <span class="dash">—</span>
          <input class="num" id="y-max" type="number" inputmode="numeric" placeholder="to" aria-label="Latest year">
        </div>
        <p class="hint">Site established where researched, else earliest unit.</p>
      </div>
      <div class="fgroup"><h2>Only show</h2>
        <label class="toggle-row"><input type="checkbox" id="only-photos"> With images</label>
        <label class="toggle-row"><input type="checkbox" id="only-shared"> Sharing a site</label>
        <label class="toggle-row"><input type="checkbox" id="only-dated"> Dated units only</label>
        <label class="toggle-row"><input type="checkbox" id="only-ops"> Has operating data</label>
        <label class="toggle-row"><input type="checkbox" id="only-retire"> Planned retirement</label>
      </div>
    </div>

    <div class="ruler" id="ruler" aria-hidden="true"></div>
    <div class="list" id="list" role="list"></div>
  </aside>

  <div class="mapcol">
    <button class="map-fab" id="sidebar-toggle" type="button" aria-label="Hide the results panel" title="Hide panel"></button>
    <div id="map"></div>
    <div class="map-note" id="map-note"></div>
  </div>
</div>

<div id="boot">
  <div class="state-msg">
    <div class="spinner"></div>
    <h2>Loading registry</h2>
    <p>Reading <code>data/plants.json</code>.</p>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
  <div class="dhead">
    <button class="dclose" id="dclose" aria-label="Close details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="tagline"><h2 id="d-name"></h2><span class="assettag" id="d-tag"></span></div>
    <div class="where" id="d-where"></div>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

const T0 = 1890, T1 = 2035;
const NOW = new Date().getFullYear();

const FUELS = ['coal','gas','oil','nuclear','hydro','wind','solar','geothermal','biomass','storage','other'];
const FUEL_LABEL = {coal:'Coal',gas:'Gas',oil:'Oil',nuclear:'Nuclear',hydro:'Hydro',wind:'Wind',solar:'Solar',geothermal:'Geothermal',biomass:'Biomass',storage:'Storage',other:'Other'};
const STATUSES = ['operating','standby','planned','retired','cancelled','unknown'];
const STATUS_LABEL = {operating:'Operating',standby:'Standby',planned:'Planned',retired:'Retired',cancelled:'Cancelled',unknown:'Unknown'};

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
const fuelColor = f => css(FUELS.includes(f) ? f : 'other');
const pct = y => ((Math.min(Math.max(y, T0), T1) - T0) / (T1 - T0)) * 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mw = v => v == null ? '—' : (v >= 1000 ? (v/1000).toFixed(1) + ' GW' : Math.round(v) + ' MW');
const num = v => v == null ? '—' : v.toLocaleString();

let DATA = null, PLANTS = [], VIEW = [], SITES = new Map();
let MAP = null, LAYER = null, CURRENT = null, BASE_LAYERS = null, LABELS = null, ACTIVE_BASE = null;

const F = {
  q:'', status:new Set(), fuel:new Set(), state:'',
  yMin:null, yMax:null, capMin:null,
  photos:false, shared:false, dated:false, ops:false, retire:false, sort:'cap-desc'
};

const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>';
const ICON_CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';

/* ------------------------------------------------------------------ theme */
function themeNow(){
  const explicit = document.documentElement.getAttribute('data-theme');
  if(explicit) return explicit;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function paintThemeButton(){
  const t = themeNow();
  $('theme-toggle').innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
  $('theme-toggle').title = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
}
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('ppr-theme', t); }catch(e){}
  paintThemeButton();
  syncMapBase(t);
  if(PLANTS.length){ renderList(); renderMap(); }
}

/* ------------------------------------------------------------------ boot */
async function boot(){
  paintThemeButton();
  let payload;
  try{
    const res = await fetch('data/plants.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    try{
      payload = JSON.parse(text);
    }catch(parseErr){
      const repaired = text.replace(/:\s*-?Infinity/g, ':null').replace(/:\s*NaN/g, ':null');
      payload = JSON.parse(repaired);
    }
  }catch(err){
    $('boot').innerHTML = `<div class="state-msg">
      <h2>Registry not loaded</h2>
      <p>${esc(err.message || err)}</p>
      <p><strong>Not generated yet?</strong> Build it: <code>python ingest.py --demo</code></p>
      <p><strong>Opened from disk?</strong> Serve it instead:</p>
      <pre>cd web &amp;&amp; python -m http.server 8000</pre>
      <p>Then open <code>http://localhost:8000</code>.</p></div>`;
    $('scope-tag').textContent = 'no data';
    return;
  }

  DATA = payload;
  PLANTS = payload.plants || [];
  PLANTS.forEach((p, i) => { p._i = i; });

  SITES = new Map();
  PLANTS.forEach(p => {
    if(!SITES.has(p.site_id)) SITES.set(p.site_id, []);
    SITES.get(p.site_id).push(p);
  });

  $('boot').hidden = true;
  $('frame').hidden = false;

  buildCounters();
  buildFilters();
  buildRuler();
  initMap();
  wire();
  paintSidebarToggle();
  apply();
}

function buildCounters(){
  const m = DATA.meta || {};
  const shared = [...SITES.values()].filter(g => g.length > 1).length;
  const cells = [
    [num(m.plant_count), 'plants'],
    [num(m.site_count), 'sites'],
    [num(m.unit_count), 'units'],
    [mw(m.total_capacity_mw), 'nameplate'],
    [m.year_min ? m.year_min + '–' + (m.year_max || NOW) : '—', 'in service'],
    [num(shared), 'shared sites'],
  ];
  $('counters').innerHTML = cells.map(([v, l]) => `<div class="counter"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('');
  const st = (m.states || []).length;
  $('scope-tag').textContent = st === 1 ? m.states[0] : st + ' states · EIA-860';
}

function buildFilters(){
  const sc = DATA.meta.status_counts || {};
  $('f-status').innerHTML = STATUSES.filter(s => sc[s]).map(s =>
    `<button class="chip" type="button" role="switch" aria-pressed="false" data-kind="status" data-val="${s}">
      <i class="lamp ${s}"></i>${STATUS_LABEL[s]}<span class="n">${num(sc[s])}</span></button>`).join('');
  const fc = DATA.meta.fuel_counts || {};
  $('f-fuel').innerHTML = FUELS.filter(f => fc[f]).map(f =>
    `<button class="chip" type="button" role="switch" aria-pressed="false" data-kind="fuel" data-val="${f}">
      <i class="swatch" style="background:var(--${f})"></i>${FUEL_LABEL[f]}<span class="n">${num(fc[f])}</span></button>`).join('');
  const sel = $('f-state');
  (DATA.meta.states || []).forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o);
  });
}

function buildRuler(){
  let html = '';
  for(let y = 1900; y <= 2030; y += 20){
    html += `<i class="gl" style="left:${pct(y)}%"></i><span class="lab" style="left:${pct(y)}%">${y}</span>`;
  }
  $('ruler').innerHTML = `<div class="rin">${html}</div>`;
}

/* ---------------------------------------------------------------- filter */
function hasImage(p){
  return (p.media || []).length > 0 || !!(p.wikidata && p.wikidata.image) || !!(p.wikipedia && p.wikipedia.thumb);
}
function establishedYear(p){ return p.site_established || (foundingGuess(p) || {}).year || p.earliest_unit_year || null; }

function matches(p){
  if(F.status.size && !F.status.has(p.status)) return false;
  if(F.fuel.size && !(p.fuels || []).some(f => F.fuel.has(f))) return false;
  if(F.state && p.state !== F.state) return false;
  if(F.capMin != null && (p.capacity_mw || 0) < F.capMin) return false;
  if(F.photos && !hasImage(p)) return false;
  if(F.shared && (SITES.get(p.site_id) || []).length < 2) return false;
  if(F.ops && !p.pudl) return false;
  if(F.retire && !(p.pudl && (p.pudl.planned_retirements || []).length)) return false;
  const y = establishedYear(p);
  if(F.dated && !y) return false;
  if(F.yMin != null && (y == null || y < F.yMin)) return false;
  if(F.yMax != null && (y == null || y > F.yMax)) return false;
  if(F.q){
    const hay = [p.name, p.utility_name, p.county, p.city, p.state, p.plant_code, ...(p.aliases || [])].join(' ').toLowerCase();
    if(!F.q.split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}

const cf = p => (p.pudl && p.pudl.capacity_factor != null) ? p.pudl.capacity_factor : null;
const SORTS = {
  name:(a,b) => (a.name||'').localeCompare(b.name||''),
  oldest:(a,b) => (a.earliest_unit_year ?? 9e3) - (b.earliest_unit_year ?? 9e3),
  newest:(a,b) => (b.earliest_unit_year ?? -9e3) - (a.earliest_unit_year ?? -9e3),
  'cap-desc':(a,b) => (b.capacity_mw ?? -1) - (a.capacity_mw ?? -1),
  'cap-asc':(a,b) => (a.capacity_mw ?? 9e9) - (b.capacity_mw ?? 9e9),
  retired:(a,b) => (b.latest_retirement_year ?? -9e3) - (a.latest_retirement_year ?? -9e3),
  'cf-desc':(a,b) => (cf(b) ?? -1) - (cf(a) ?? -1),
};

function activeFilterCount(){
  return F.status.size + F.fuel.size + (F.state?1:0) + (F.yMin!=null?1:0) + (F.yMax!=null?1:0) +
         (F.capMin!=null?1:0) + (F.photos?1:0) + (F.shared?1:0) + (F.dated?1:0) + (F.ops?1:0) + (F.retire?1:0);
}
function paintFilterBadge(){
  const n = activeFilterCount();
  const b = $('fbadge');
  if(n){ b.textContent = n; b.hidden = false; } else b.hidden = true;
}

function apply(){
  VIEW = PLANTS.filter(matches).sort(SORTS[F.sort] || SORTS['cap-desc']);
  paintFilterBadge();
  renderTally();
  renderList();
  renderMap();
}

function renderTally(){
  const cap = VIEW.reduce((s,p) => s + (p.capacity_mw || 0), 0);
  const withPhoto = VIEW.filter(hasImage).length;
  $('tally').innerHTML =
    `<b>${num(VIEW.length)}</b> of ${num(PLANTS.length)} plants<span class="dot">·</span>${mw(cap)}<span class="dot">·</span>${num(withPhoto)} imaged`;
}

/* ------------------------------------------------------------------ list */
const MAX_LANES = 7;

function spanHTML(p, laneH){
  let html = '';
  for(let y = 1900; y <= 2030; y += 20) html += `<i class="grid" style="left:${pct(y)}%"></i>`;
  const units = p.units || [];
  const shown = units.slice(0, MAX_LANES);
  shown.forEach((u, i) => {
    const top = i * laneH;
    const col = fuelColor(u.fuel);
    if(u.operating_year == null){
      html += `<i class="bar undated" style="left:0;width:20%;top:${top}px"></i>`;
      return;
    }
    const live = u.retirement_year == null && u.status !== 'retired' && u.status !== 'cancelled';
    const end = u.retirement_year ?? (live ? NOW : u.operating_year + 1);
    const l = pct(u.operating_year);
    const w = Math.max(pct(Math.max(end, u.operating_year + 1)) - l, 0.7);
    const bg = live ? `linear-gradient(90deg,${col} 0%,${col} 78%,transparent 100%)` : col;
    html += `<i class="bar" style="left:${l}%;width:${w}%;top:${top}px;background:${bg};animation-delay:${Math.min(i*22,140)}ms"></i>`;
  });
  if(units.length > MAX_LANES) html += `<span class="more" style="top:${MAX_LANES*laneH}px">+${units.length - MAX_LANES} more units</span>`;
  return html;
}

function renderList(){
  const list = $('list');
  if(!VIEW.length){
    list.innerHTML = `<div class="state-msg"><h2>No matches</h2>
      <p>Nothing fits those filters. Widen the year range, or clear the fuel and status chips.</p></div>`;
    return;
  }
  const CAP = 600;
  const laneH = 6;
  const frag = document.createDocumentFragment();

  VIEW.slice(0, CAP).forEach(p => {
    const lanes = Math.min((p.units || []).length, MAX_LANES);
    const h = Math.max(lanes * laneH + ((p.units||[]).length > MAX_LANES ? 12 : 0), 12);
    const siblings = (SITES.get(p.site_id) || []).length;
    const year = p.site_established || p.earliest_unit_year;
    const yearMark = p.site_established ? '†' : '';

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.setAttribute('role', 'listitem');
    card.dataset.i = p._i;
    if(CURRENT && CURRENT._i === p._i) card.setAttribute('aria-current', 'true');

    card.innerHTML = `
      <div class="c-top">
        <i class="lamp ${p.status}" title="${STATUS_LABEL[p.status]||''}"></i>
        <strong>${esc(p.name)}</strong>
        ${hasImage(p) ? '<i class="badge badge-photo">IMG</i>' : ''}
        ${siblings > 1 ? '<i class="badge badge-site">SITE</i>' : ''}
        <span class="c-cap">${mw(p.capacity_mw)}</span>
      </div>
      <div class="c-meta">${esc(p.state || '??')} · ${esc(p.county || 'county n/r')} · ${year ? year + yearMark : 'undated'} · ${p.unit_count} unit${p.unit_count===1?'':'s'}</div>
      <div class="c-span"><span class="span" style="height:${h}px">${spanHTML(p, laneH)}</span></div>`;
    frag.appendChild(card);
  });

  list.innerHTML = '';
  list.appendChild(frag);
  if(VIEW.length > CAP){
    const more = document.createElement('div');
    more.className = 'state-msg';
    more.innerHTML = `<p>Showing the first ${CAP} of ${num(VIEW.length)} matches. Narrow the filters or search to see the rest — the map shows more.</p>`;
    list.appendChild(more);
  }
}

/* ------------------------------------------------------------------- map */
function initMap(){
  MAP = L.map('map', {preferCanvas:true, zoomControl:true, worldCopyJump:false}).setView([39.5, -98], 4);
  const cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:19});
  const cartoLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {attribution:'&copy; OpenStreetMap contributors &copy; CARTO', subdomains:'abcd', maxZoom:19});
  const esriSat = L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'Imagery: Esri, Maxar, Earthstar Geographics, USDA, USGS &amp; the GIS User Community', maxZoom:19, maxNativeZoom:19});
  const usgsImg = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', {attribution:'Imagery: USGS The National Map (NAIP)', maxZoom:19, maxNativeZoom:16});
  LABELS = L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {attribution:'Labels: Esri', maxZoom:19, opacity:0.9});

  BASE_LAYERS = {'Map · dark':cartoDark, 'Map · light':cartoLight, 'Satellite':esriSat, 'Aerial · USGS/NAIP':usgsImg};
  ACTIVE_BASE = 'Satellite';
  BASE_LAYERS[ACTIVE_BASE].addTo(MAP);
  L.control.layers(BASE_LAYERS, {'Place labels':LABELS}, {position:'topright', collapsed:true}).addTo(MAP);
  MAP.on('baselayerchange', e => {
    ACTIVE_BASE = e.name;
    const imagery = e.name === 'Satellite' || e.name.startsWith('Aerial');
    if(imagery && !MAP.hasLayer(LABELS)) LABELS.addTo(MAP);
    if(!imagery && MAP.hasLayer(LABELS)) MAP.removeLayer(LABELS);
  });
  LAYER = L.layerGroup().addTo(MAP);
}

function setBase(name){
  if(!BASE_LAYERS || !BASE_LAYERS[name] || ACTIVE_BASE === name) return;
  Object.values(BASE_LAYERS).forEach(l => { if(MAP.hasLayer(l)) MAP.removeLayer(l); });
  BASE_LAYERS[name].addTo(MAP);
  MAP.fire('baselayerchange', {name, layer:BASE_LAYERS[name]});
}

function syncMapBase(t){
  if(!ACTIVE_BASE) return;
  if(ACTIVE_BASE === 'Map · dark' && t === 'light') setBase('Map · light');
  else if(ACTIVE_BASE === 'Map · light' && t === 'dark') setBase('Map · dark');
}

function renderMap(){
  if(!LAYER) return;
  LAYER.clearLayers();
  const located = VIEW.filter(p => p.latitude != null && p.longitude != null);
  const CAP = 4000;
  located.slice(0, CAP).forEach(p => {
    const r = p.capacity_mw ? Math.min(3 + Math.sqrt(p.capacity_mw) / 7, 13) : 3;
    const c = fuelColor(p.primary_fuel);
    const m = L.circleMarker([p.latitude, p.longitude], {
      radius:r, color:c, weight:1,
      opacity: p.status === 'retired' ? 0.55 : 0.95,
      fillColor:c, fillOpacity: p.status === 'retired' ? 0.55 : 0.55,
    });
    m.on('click', () => openDetail(p));
    m.bindTooltip(`${esc(p.name)} · ${mw(p.capacity_mw)}`, {direction:'top', offset:[0,-4]});
    LAYER.addLayer(m);
  });
  const missing = VIEW.length - located.length;
  const parts = [`${num(Math.min(located.length, CAP))} mapped`];
  if(located.length > CAP) parts.push(`${num(located.length - CAP)} not drawn`);
  if(missing > 0) parts.push(`${num(missing)} without coordinates`);
  $('map-note').textContent = parts.join(' · ');
}

/* ---------------------------------------------------------------- detail */
function detailSpan(p){
  const units = p.units || [];
  if(!units.length) return '<p class="note">No generator records.</p>';
  let lanes = '';
  units.forEach(u => {
    const col = fuelColor(u.fuel);
    let bar = '', yr = '';
    if(u.operating_year == null){
      bar = `<i class="bar" style="left:0;width:14%;background:none;border:1px dashed var(--border)"></i>`;
      yr = `<span class="yr" style="left:15%">date not reported</span>`;
    }else{
      const live = u.retirement_year == null && u.status !== 'retired' && u.status !== 'cancelled';
      const end = u.retirement_year ?? (live ? NOW : u.operating_year + 1);
      const l = pct(u.operating_year);
      const w = Math.max(pct(Math.max(end, u.operating_year + 1)) - l, 0.7);
      const bg = live ? `linear-gradient(90deg,${col} 0%,${col} 82%,transparent 100%)` : col;
      bar = `<i class="bar" style="left:${l}%;width:${w}%;background:${bg}"></i>`;
      const label = u.retirement_year ? `${u.operating_year}–${u.retirement_year}` : `${u.operating_year}–`;
      const right = l + w > 74;
      yr = right
        ? `<span class="yr" style="right:${(100 - l).toFixed(1)}%;padding-right:6px">${label}</span>`
        : `<span class="yr" style="left:${(l + w).toFixed(1)}%;padding-left:6px">${label}</span>`;
    }
    let grid = '';
    for(let y = 1900; y <= 2030; y += 20) grid += `<i class="grid" style="left:${pct(y)}%"></i>`;
    lanes += `<div class="lane"><span class="lbl" title="${esc(u.generator_id)}">${esc(u.generator_id)}</span>
              <span class="track">${grid}${bar}${yr}</span></div>`;
  });
  let axis = '';
  for(let y = 1900; y <= 2030; y += 20) axis += `<span class="lab" style="left:${pct(y)}%">${y}</span>`;
  return `<div class="dspan">${lanes}<div class="axis">${axis}</div></div>`;
}

function detailUnits(p){
  const rows = (p.units || []).map(u => `
    <tr>
      <td><i class="fuel-dot" style="background:${fuelColor(u.fuel)}"></i>${esc(u.generator_id)}</td>
      <td>${esc(u.technology || '—')}</td>
      <td class="n">${u.capacity_mw != null ? u.capacity_mw.toFixed(1) : '—'}</td>
      <td class="n">${u.operating_year ?? '—'}</td>
      <td class="n">${u.retirement_year ?? '—'}</td>
      <td><i class="lamp ${u.status}" style="display:inline-block;margin-right:5px"></i>${esc(u.status_label || u.status)}</td>
    </tr>`).join('');
  return `<table class="units">
    <thead><tr><th>Unit</th><th>Technology</th><th class="n">MW</th><th class="n">In</th><th class="n">Out</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function detailSatellite(p){
  if(p.latitude == null || p.longitude == null) return '';
  const lat = p.latitude, lon = p.longitude;
  const latHalf = 0.006;
  const lonHalf = latHalf * (60/34) / Math.cos(lat * Math.PI / 180);
  const bbox = [lon-lonHalf, lat-latHalf, lon+lonHalf, lat+latHalf].join(',');
  const src = 'https://services.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/export'
    + `?bbox=${bbox}&bboxSR=4326&imageSR=3857&size=600,340&format=jpg&f=image`;
  return `<div class="dsec"><h3>Satellite view</h3>
    <div class="satview">
      <img src="${src}" alt="Satellite imagery centred on ${esc(p.name)}" loading="lazy">
      <div class="satcap">
        <span>Esri World Imagery · ~1&nbsp;km across · ${lat.toFixed(4)}, ${lon.toFixed(4)}</span>
        <button class="link-btn sat-focus" type="button">Show on map</button>
      </div>
    </div></div>`;
}

function detailEncyclopedia(p){
  const wd = p.wikidata, wp = p.wikipedia;
  if(!wd && !wp) return '';
  const lead = (wp && wp.thumb) || (wd && wd.image) || null;
  const leadHref = (wd && wd.image) || (wp && wp.url) || null;
  const img = lead ? `<a class="enc-lead" href="${esc(leadHref)}" target="_blank" rel="noopener"><img src="${esc(lead)}" alt="${esc(p.name)}" loading="lazy"></a>` : '';
  const prose = (wp && wp.extract) ? `<p class="enc-extract">${esc(wp.extract)}</p>` : '';
  const links = [];
  if(wp && wp.url) links.push(`<a href="${esc(wp.url)}" target="_blank" rel="noopener">Wikipedia</a>`);
  if(wd && wd.commons_category) links.push(`<a href="https://commons.wikimedia.org/wiki/Category:${encodeURIComponent(wd.commons_category)}" target="_blank" rel="noopener">Commons gallery</a>`);
  if(wd && wd.url) links.push(`<a href="${esc(wd.url)}" target="_blank" rel="noopener">Wikidata</a>`);
  const extra = [];
  if(wd && wd.operator) extra.push(`Operator (Wikidata): ${esc(wd.operator)}`);
  if(wd && wd.inception) extra.push(`Founded ${wd.inception}`);
  else if(wd && wd.start_year) extra.push(`First operation ${wd.start_year}`);
  const nameMatched = wp && wp.match === 'name';
  const cred = nameMatched
    ? `Text from Wikipedia (CC&nbsp;BY-SA), matched to this plant by name and state&nbsp;&mdash; <span class="pill unver">unverified</span>. The article may describe a different plant of the same name; confirm before citing.`
    : `Text from Wikipedia (CC&nbsp;BY-SA); facts from Wikidata (CC0), joined on the EIA plant code. Auto-linked&nbsp;&mdash; verify before citing.`;
  return `<div class="dsec"><h3>Encyclopedia</h3>
    <div class="enc">${img}
      <div class="enc-body">
        ${prose}
        ${extra.length ? `<p class="note">${extra.join(' · ')}</p>` : ''}
        ${links.length ? `<p class="enc-links">${links.join('<span class="sep">·</span>')}</p>` : ''}
        <p class="note enc-cred">${cred}</p>
      </div>
    </div></div>`;
}

function foundingGuess(p){
  const nid = (p.history || {}).nid;
  if(nid && nid.year_completed) return {year: nid.year_completed, src:'NID dam'};
  const wd = p.wikidata;
  if(wd && (wd.inception || wd.start_year)) return {year: wd.inception || wd.start_year, src:'Wikidata'};
  return null;
}

function detailOperations(p){
  const pu = p.pudl;
  if(!pu) return '';
  const rows = [];
  if(pu.capacity_factor != null) rows.push(['Capacity factor', `${Math.round(pu.capacity_factor*100)}% <span class="dim">(${pu.report_year})</span>`]);
  if(pu.net_generation_mwh != null) rows.push(['Net generation', `${num(pu.net_generation_mwh)} MWh <span class="dim">(${pu.report_year})</span>`]);
  if(pu.heat_rate_mmbtu_mwh != null) rows.push(['Heat rate', `${pu.heat_rate_mmbtu_mwh} MMBtu/MWh`]);
  if(pu.iso_rto) rows.push(['ISO / RTO', esc(pu.iso_rto)]);
  if(pu.nerc_region) rows.push(['NERC region', esc(pu.nerc_region)]);
  if(!rows.length && !(pu.planned_retirements||[]).length) return '';
  const facts = rows.map(([l,v]) => `<div class="fact"><span>${l}</span><b>${v}</b></div>`).join('');
  let planned = '';
  if((pu.planned_retirements||[]).length){
    const items = pu.planned_retirements.map(r => `unit ${esc(String(r.generator_id))} in <b>${r.year}</b>`).join(', ');
    planned = `<p class="note" style="margin-top:11px"><strong>Planned retirement:</strong> ${items}. Forward-looking, from the latest EIA filing&nbsp;&mdash; subject to change.</p>`;
  }
  return `<div class="dsec"><h3>Operations</h3>
    <div class="facts">${facts}</div>${planned}
    <p class="note enc-cred">Generation, capacity factor and planned retirements from PUDL / Catalyst Cooperative (CC&nbsp;BY&nbsp;4.0), joined on the EIA plant code. Capacity factor is annual net generation over nameplate&nbsp;&times;&nbsp;8760&nbsp;h.</p></div>`;
}

function detailHistory(p){
  const nid = (p.history || {}).nid;
  if(!nid) return '';
  const rows = [
    ['Dam', nid.dam_name],['Completed', nid.year_completed],['Modified', nid.years_modified],
    ['Builder / designer', nid.designer],['Owner', nid.owner],['River', nid.river],
    ['Height', nid.height_ft ? `${nid.height_ft} ft` : null],['Purposes', nid.purposes],
  ].filter(([, v]) => v != null && v !== '');
  const facts = rows.map(([l, v]) => `<div class="fact"><span>${l}</span><b>${esc(String(v))}</b></div>`).join('');
  return `<div class="dsec"><h3>Site history</h3>
    <div class="facts">${facts}</div>
    <p class="enc-links" style="margin-top:11px">
      <a href="${esc(nid.url)}" target="_blank" rel="noopener">NID dam record</a>
      <span class="sep">·</span><span class="note" style="display:inline">${nid.distance_km} km from plant point</span></p>
    <p class="note enc-cred">USACE National Inventory of Dams (public domain), matched on location and name&nbsp;&mdash; <span class="pill unver">unverified</span> until confirmed. A dam's completion year is the age of the <em>site</em>, not necessarily of the generators inside it.</p></div>`;
}

function detailGem(p){
  const g = p.gem;
  if(!g) return '';
  const meta = [];
  if(g.statuses && g.statuses.length) meta.push(['Tracker status', g.statuses.join(', ')]);
  if(g.owner) meta.push(['Owner', g.owner]);
  if(g.parent) meta.push(['Parent', g.parent]);
  const facts = meta.map(([l, v]) => `<div class="fact"><span>${l}</span><b>${esc(String(v))}</b></div>`).join('');
  let units = '';
  if((g.units || []).length){
    const rows = g.units.map(u => `<tr>
      <td>${esc(u.unit || '—')}</td><td>${esc(u.status || '—')}</td>
      <td class="n">${u.capacity_mw != null ? mw(u.capacity_mw) : '—'}</td>
      <td class="n">${u.start_year ?? '—'}</td><td class="n">${u.retired_year ?? '—'}</td></tr>`).join('');
    units = `<table class="units" style="margin-top:11px"><thead><tr>
      <th>Unit</th><th>Status</th><th class="n">MW</th><th class="n">Start</th><th class="n">Retired</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  return `<div class="dsec"><h3>Global Energy Monitor</h3>
    <div class="facts">${facts}</div>${units}
    ${g.url ? `<p class="enc-links" style="margin-top:11px"><a href="${esc(g.url)}" target="_blank" rel="noopener">GEM record</a></p>` : ''}
    <p class="note enc-cred">GEM Global Integrated Power Tracker (CC&nbsp;BY&nbsp;4.0), matched on location and name&nbsp;&mdash; <span class="pill unver">unverified</span> until confirmed.</p></div>`;
}

function detailGemWiki(p){
  const g = (p.media || []).find(m => m.source_key === 'gem' && m.url);
  if(!g) return '';
  return `<div class="dsec"><h3>Global Energy Monitor</h3>
    ${g.extract ? `<p class="enc-extract">${esc(g.extract)}</p>` : ''}
    <p class="enc-links"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title || 'GEM wiki profile')} ↗</a></p>
    <p class="note enc-cred">Profile from the GEM wiki (gem.wiki, CC&nbsp;BY&nbsp;4.0), matched on name and location&nbsp;&mdash; <span class="pill unver">unverified</span> until confirmed.</p></div>`;
}

function detailStreet(p){
  const refs = (p.media || []).filter(m => m.source_key === 'mapillary' || m.source_key === 'streetview');
  if(!refs.length) return '';
  const links = refs.map(m => {
    const yr = m.date ? ' · ' + String(m.date).slice(0, 7) : '';
    return `<a class="street-link" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.source)}${yr} ↗</a>`;
  }).join('');
  return `<div class="dsec"><h3>Street-level imagery</h3>
    <div class="street-links">${links}</div>
    <p class="note enc-cred">Ground-level views near the plant's coordinates. Mapillary is CC&nbsp;BY-SA&nbsp;4.0; Street View opens on Google Maps (Google's terms don't permit rehosting the image). Location-matched&nbsp;&mdash; the nearest capture may be up the road.</p></div>`;
}

function detailMedia(p){
  const media = (p.media || []).filter(m => !['gem', 'mapillary', 'streetview'].includes(m.source_key));
  if(!media.length){
    return `<p class="note">No image references attached. Run <code>python enrich_media.py</code> to search HAER and Wikimedia Commons, or add known sources to <code>overrides.yaml</code>.</p>`;
  }
  const cards = media.map(m => {
    const pd = (m.rights_status || '').startsWith('public-domain');
    return `<a class="media-card" href="${esc(m.url)}" target="_blank" rel="noopener">
      <span class="ph">${m.thumb ? `<img src="${esc(m.thumb)}" alt="${esc(m.title)}" loading="lazy">` : 'NO PREVIEW'}</span>
      <span class="mc">
        <span class="mt">${esc(m.title)}</span>
        <span class="ms">${esc(m.source)}${m.date ? ' · ' + esc(String(m.date).slice(0,10)) : ''}</span>
        ${m.author ? `<span class="ms">${esc(m.author)}</span>` : ''}
        <span class="pill ${pd ? 'pd' : ''}">${esc(m.rights || 'rights unknown')}</span>
        ${m.verified ? '' : '<span class="pill unver">unverified match</span>'}
      </span></a>`;
  }).join('');
  return `<div class="media-grid">${cards}</div>
    <p class="note" style="margin-top:12px">Matched automatically on name and location. Confirm each one before citing it.</p>`;
}

function openDetail(p){
  const wasOpen = !$('drawer').hidden;
  CURRENT = p;
  if(!wasOpen) history.pushState({drawer:true}, '');
  const siblings = (SITES.get(p.site_id) || []).filter(s => s !== p);
  const fg = foundingGuess(p);

  $('d-name').textContent = p.name || '—';
  $('d-tag').textContent = 'EIA ' + p.plant_code;
  $('d-where').textContent = [
    p.city, p.county ? p.county + ' County' : null, p.state,
    (p.latitude != null && p.longitude != null) ? `${p.latitude.toFixed(4)}, ${p.longitude.toFixed(4)}` : 'no coordinates'
  ].filter(Boolean).join(' · ');

  const facts = [
    ['Status', `<i class="lamp ${p.status}" style="display:inline-block;margin-right:6px"></i>${STATUS_LABEL[p.status] || p.status}`],
    ['Nameplate', mw(p.capacity_mw)],
    ['Units', p.unit_count],
    ['Primary fuel', FUEL_LABEL[p.primary_fuel] || p.primary_fuel],
    ['Operator', p.utility_name || '<span class="dim">not reported</span>'],
    ['Earliest unit', p.earliest_unit_year ?? '<span class="dim">not reported</span>'],
    ['Site established', p.site_established
      ? p.site_established
      : (fg ? `${fg.year} <span class="dim">(${fg.src})</span>` : '<span class="dim">not researched</span>')],
    ['Last retirement', p.latest_retirement_year ?? '<span class="dim">—</span>'],
    ['In EIA series', p.first_reported ? `${p.first_reported}–${p.last_reported}` : '—'],
  ];
  let html = `<div class="dsec"><h3>Record</h3><div class="facts">${
    facts.map(([l, v]) => `<div class="fact"><span>${l}</span><b>${v}</b></div>`).join('')}</div></div>`;

  if(!p.site_established && !fg && p.earliest_unit_year){
    html += `<div class="dsec"><div class="caveat">
      <strong>${p.earliest_unit_year}</strong> is the earliest <em>generator</em> date EIA reports — a lower bound on the age of this site, not its founding year. A rewind, uprate, or replacement machine resets that date while the powerhouse around it stays put. Establish the real date from an NRHP nomination, HAER narrative, or utility history, then record it in <code>overrides.yaml</code>.
    </div></div>`;
  }

  html += detailSatellite(p);
  html += detailStreet(p);
  html += detailOperations(p);
  html += detailEncyclopedia(p);
  html += detailGemWiki(p);
  html += detailHistory(p);
  html += detailGem(p);
  if(p.notes) html += `<div class="dsec"><h3>Notes</h3><p class="note">${esc(p.notes)}</p></div>`;
  if(siblings.length){
    html += `<div class="dsec"><h3>Also on this site (${esc(p.site_id)})</h3>` +
      siblings.map(s => `<button class="sibling" type="button" data-i="${s._i}">
        <strong>${esc(s.name)}</strong>
        <span>EIA ${s.plant_code} · ${STATUS_LABEL[s.status]||s.status} · ${mw(s.capacity_mw)} · ${s.earliest_unit_year ?? 'undated'}</span></button>`).join('') +
      `<p class="note">Grouped by proximity, so treat it as a strong hint rather than a fact.</p></div>`;
  }
  html += `<div class="dsec"><h3>Unit history</h3>${detailSpan(p)}</div>`;
  html += `<div class="dsec"><h3>Generators</h3>${detailUnits(p)}</div>`;
  html += `<div class="dsec"><h3>Images</h3>${detailMedia(p)}</div>`;

  $('dbody').innerHTML = html;
  $('dbody').scrollTop = 0;

  const d = $('drawer');
  d.hidden = false;
  requestAnimationFrame(() => { d.classList.add('open'); $('scrim').classList.add('open'); });
  $('dclose').focus();
  document.querySelectorAll('.card').forEach(r => r.setAttribute('aria-current', String(Number(r.dataset.i) === p._i)));
}

function closeDetail(fromPopstate){
  const d = $('drawer');
  if(d.hidden) return;
  d.classList.remove('open');
  $('scrim').classList.remove('open');
  setTimeout(() => { if(!d.classList.contains('open')) d.hidden = true; }, 260);
  document.querySelectorAll('.card').forEach(r => r.setAttribute('aria-current', 'false'));
  CURRENT = null;
  if(!fromPopstate && history.state && history.state.drawer) history.back();
}

/* --------------------------------------------------------- sidebar toggle */
function paintSidebarToggle(){
  const off = $('frame').classList.contains('no-side');
  const btn = $('sidebar-toggle');
  btn.innerHTML = off ? ICON_LIST : ICON_CHEV_L;
  btn.setAttribute('aria-label', off ? 'Show the results panel' : 'Hide the results panel');
  btn.title = off ? 'Show panel' : 'Hide panel';
}

/* ------------------------------------------------------------------ wire */
function wire(){
  $('theme-toggle').addEventListener('click', () => setTheme(themeNow() === 'dark' ? 'light' : 'dark'));

  let t;
  $('q').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => { F.q = e.target.value.trim().toLowerCase(); apply(); }, 140);
  });

  $('filters-toggle').addEventListener('click', () => {
    const panel = $('filters');
    const open = panel.classList.toggle('collapsed') === false;
    $('filters-toggle').setAttribute('aria-expanded', String(open));
  });
  $('reset-all').addEventListener('click', resetFilters);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const set = F[chip.dataset.kind], val = chip.dataset.val, on = set.has(val);
      on ? set.delete(val) : set.add(val);
      chip.setAttribute('aria-pressed', String(!on));
      apply();
    });
  });

  const bindNum = (id, key) => $(id).addEventListener('input', e => {
    const v = e.target.value.trim();
    F[key] = v === '' ? null : Number(v);
    apply();
  });
  bindNum('y-min', 'yMin'); bindNum('y-max', 'yMax'); bindNum('cap-min', 'capMin');

  $('f-state').addEventListener('change', e => { F.state = e.target.value; apply(); });
  $('sort').addEventListener('change', e => { F.sort = e.target.value; apply(); });

  [['only-photos','photos'],['only-shared','shared'],['only-dated','dated'],['only-ops','ops'],['only-retire','retire']]
    .forEach(([id, key]) => $(id).addEventListener('change', e => { F[key] = e.target.checked; apply(); }));

  $('sidebar-toggle').addEventListener('click', () => {
    $('frame').classList.toggle('no-side');
    paintSidebarToggle();
    if(MAP) setTimeout(() => MAP.invalidateSize(), 260);
  });

  $('list').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if(!card) return;
    const i = Number(card.dataset.i);
    if(CURRENT && CURRENT._i === i && !$('drawer').hidden) closeDetail();
    else openDetail(PLANTS[i]);
  });

  $('dbody').addEventListener('click', e => {
    const sib = e.target.closest('.sibling');
    if(sib){ openDetail(PLANTS[Number(sib.dataset.i)]); return; }
    if(e.target.closest('.sat-focus') && CURRENT && CURRENT.latitude != null){
      setBase('Satellite');
      setTimeout(() => { MAP.invalidateSize(); MAP.setView([CURRENT.latitude, CURRENT.longitude], 16); }, 80);
      closeDetail();
    }
  });

  $('dclose').addEventListener('click', () => closeDetail());
  $('scrim').addEventListener('click', () => closeDetail());
  window.addEventListener('popstate', () => closeDetail(true));
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !$('drawer').hidden) closeDetail();
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)){ e.preventDefault(); $('q').focus(); }
  });

  $('export').addEventListener('click', exportCSV);
}

function resetFilters(){
  F.q = ''; F.status.clear(); F.fuel.clear(); F.state = '';
  F.yMin = F.yMax = F.capMin = null;
  F.photos = F.shared = F.dated = F.ops = F.retire = false;
  $('q').value = '';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  ['y-min','y-max','cap-min'].forEach(id => $(id).value = '');
  $('f-state').value = '';
  ['only-photos','only-shared','only-dated','only-ops','only-retire'].forEach(id => $(id).checked = false);
  apply();
}

function exportCSV(){
  const cols = ['plant_code','site_id','name','state','county','city','utility_name','status',
    'primary_fuel','capacity_mw','unit_count','earliest_unit_year','site_established',
    'latest_retirement_year','latitude','longitude'];
  const val = (p, c) => c === 'capacity_factor' ? ((p.pudl && p.pudl.capacity_factor != null) ? p.pudl.capacity_factor : '') : p[c];
  const allCols = cols.concat(['capacity_factor']);
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [allCols.join(',')].concat(VIEW.map(p => allCols.map(c => cell(val(p, c))).join(','))).join('\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a');
  a.href = url; a.download = `power-plants-${VIEW.length}.csv`; a.click();
  URL.revokeObjectURL(url);
}

boot();
</script>
